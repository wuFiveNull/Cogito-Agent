app:
  name: "Cogito-Agent"
  data_dir: "~/.cogito/data"
  workspace_root: "~/.cogito/workspace"
  default_entrypoint: "cli"

model:
  provider: "deepseek"
  base_url: "https://api.deepseek.com/v1"
  api_key_ref: null
  model: "deepseek-v4-flash"
  timeout_seconds: 60
  max_retries: 2

  # Multi-candidate model configuration (v0.17+)
  candidates:
    - id: deepseek-main
      provider: deepseek
      base_url: "https://api.deepseek.com/v1"
      api_key: "sk-your-deepseek-api-key"
      model: "deepseek-v4-flash"
      capabilities: [chat, reasoning, tools, json, code, long_context]
      roles: [planner, coder, executor]
      input_modalities: [text]
      output_formats: [text, json]
      context_window: 65536
      priority: 100

    - id: qwen-vision
      provider: qwen-vl
      base_url: "https://api.siliconflow.cn/v1"
      api_key: "sk-your-siliconflow-api-key"
      model: "Qwen/Qwen3.6-27B"
      capabilities: [chat, vision, ocr, json]
      roles: [vision_worker]
      input_modalities: [text, image]
      output_formats: [text, json]
      priority: 90

  routes:
    vision_understanding:
      required_capabilities: [chat, vision, json]
      preferred_candidates: ["qwen-vision"]
    planning:
      required_capabilities: [chat, reasoning]
      preferred_candidates: [deepseek-main]
    coding:
      required_capabilities: [chat, reasoning, code]
      preferred_candidates: [deepseek-main]

runtime:
  max_turn_steps: 12
  max_model_calls: 4
  max_tool_calls: 5
  max_context_tokens: 24000
  max_output_tokens: 4000
  max_cost_usd_per_turn: 0.20
  turn_timeout_seconds: 120

memory:
  enabled: true
  write_mode: "candidate_requires_approval"
  retrieval:
    bm25_top_k: 8
    vector_top_k: 0
    final_top_k: 6

trace:
  enabled: true
  payload_mode: "metadata_plus_redacted"
  retention_days: 30

audit:
  enabled: true

capabilities:
  enabled:
    - "time.now"
    - "file.list"
    - "file.read"
    - "note.write"

security:
  deny_shell: true
  deny_workspace_escape: true
  external_content_trust: "untrusted"
