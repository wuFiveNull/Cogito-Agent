[project]
name = "cogito-agent"
version = "0.7.0-rc1"
description = "A local-first personal Agent runtime with memory, governed capabilities, traceable execution, reusable skills, and constrained proactive behavior."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]
vector = [
    "sentence-transformers>=3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[project.scripts]
cogito = "cogito_agent.cli:run_cli"
cogito-demo = "cogito_agent.cli.e2e_demo:run_e2e_demo"
cogito-daemon = "cogito_agent.cli.daemon:run_daemon"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
