[project]
name = "cogito-agent"
version = "0.17.0-dev"
description = "A local-first personal Agent runtime with memory, governed capabilities, traceable execution, reusable skills, and constrained proactive behavior."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27",
    "python-json-logger>=2.0",
    "Pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]
e2e = [
    "playwright>=1.50",
]
windows-service = [
    "pywin32>=306; platform_system == 'Windows'",
]
vector = [
    "sentence-transformers>=3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[project.scripts]
cogito = "cogito_agent.cli:run_cli"
cogito-demo = "cogito_agent.cli.e2e_demo:run_e2e_demo"
cogito-daemon = "cogito_agent.cli.daemon:main"
cogito-console = "cogito_agent.cli.console:run_console"

[tool.setuptools.package-data]
cogito_agent = [
    "console/templates/**/*.html",
    "console/static/*",
    "storage/migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "browser_e2e: real-browser Console tests requiring the e2e extra and Chromium",
]
