<div class="session-item" data-session-id="{{ session.id | e }}">
  <a href="#" class="session-link"
     hx-get="/console/chat/sessions/{{ session.id | e }}"
     hx-target="#chat-messages"
     hx-swap="innerHTML"
     hx-indicator="#global-spinner">
    <div class="session-title">{{ session.title[:40] | e if session.title else 'Chat' | e }}</div>
    <div class="session-meta">
      <span class="session-count">0 msg</span>
    </div>
  </a>
  <div class="session-actions">
    <button class="btn-icon" type="button"
            onclick="this.closest('.session-item').querySelector('.session-rename').toggleAttribute('hidden')"
            title="Rename">Edit</button>
    <button class="btn-icon"
            hx-post="/console/chat/sessions/{{ session.id | e }}/branch"
            hx-target="#session-list" hx-swap="afterbegin" title="Branch">Fork</button>
    <div class="delete-controls">
      <button class="btn-icon btn-archive btn-del-trigger" title="Delete this session">🗑</button>
      <span class="del-confirm" style="display:none">
        <button class="btn-icon btn-confirm-yes" title="Confirm delete"
                hx-post="/console/chat/sessions/{{ session.id | e }}/archive"
                hx-target="closest .session-item"
                hx-swap="outerHTML">✓</button>
        <button class="btn-icon btn-confirm-no" title="Cancel">✗</button>
      </span>
    </div>
  </div>
  <form class="session-rename" hidden
        hx-post="/console/chat/sessions/{{ session.id | e }}/rename"
        hx-target="closest .session-item" hx-swap="outerHTML">
    <label class="sr-only" for="rename-{{ session.id | e }}">Session title</label>
    <input id="rename-{{ session.id | e }}" name="title"
           value="{{ session.title | e }}" maxlength="80" required>
  </form>
</div>
